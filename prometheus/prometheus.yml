global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 主机指标：CPU / 内存 / 磁盘 / 网络
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: ops-lab-server

  # 应用指标：访问量 / MySQL、Redis 连通性
  - job_name: flask-app
    static_configs:
      - targets: ["app:5000"]
